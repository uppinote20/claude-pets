name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The mod API is early access and moves between Claude Code releases. A weekly run
  # against the latest release catches a break before users report it.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate manifests
        run: |
          claude --version
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .claude-plugin/marketplace.json

      - name: Test
        run: claude plugin test .

      # The README images are generated from the sprite data: a sprite edit without a
      # regenerate leaves them stale.
      - name: Check species images are up to date
        run: |
          node scripts/sprites.mjs
          git diff --exit-code -- assets/
